<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="自动识别当前公网 IP，联合多个数据库检测网络属性、风险标记、地理归属及来源分歧。">
  <meta name="theme-color" content="#0d1219">
  <meta name="color-scheme" content="dark">
  <meta name="referrer" content="no-referrer">
  <title>IP 质量检测 · Egress</title>
  <link rel="icon" href="./favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./styles.css?v=1.3">
  <script type="module" src="./app.js?v=1.3"></script>
</head>
<body>
  <a class="skip-link" href="#main">跳到检测内容</a>
  <main id="main" class="ip-page">
    <header class="page-header">
      <div class="page-heading"><div class="brand-line"><span class="brand-symbol" aria-hidden="true">◈</span><span>Egress</span><span class="brand-separator">/</span><span>网络工具</span></div><h1 id="page-title">IP 质量检测</h1></div>
      <div class="query-panel"><form id="assessment-form"><label class="sr-only" for="assessment-ip">当前 IP 自动识别，可输入其他公网 IPv4 或 IPv6</label><input id="assessment-ip" type="text" placeholder="正在识别当前 IP…" autocomplete="off" spellcheck="false" autocapitalize="off"><button id="start-assessment" type="submit">查询</button></form><div class="query-options"><span class="query-hint">自动填入当前公网 IP</span><label class="mask-control"><input id="mask-ip" type="checkbox" checked><span>隐藏 IP</span></label><button id="cancel-assessment" class="text-button" type="button" disabled>取消</button><button id="export-assessment" class="text-button" type="button">导出 <span aria-hidden="true">↗</span></button></div></div>
      <p class="page-description">多库交叉检测，查看网络属性、风险标记与归属分歧。</p>
    </header>
    <div id="assessment-status" class="assessment-status" role="status" aria-live="polite">正在识别当前出口；识别完成后可直接查询。</div>
    <section id="assessment-summary" aria-label="IP 检测结果"><div class="empty-state"><span class="empty-symbol" aria-hidden="true">◎</span><div><h2>准备检测当前网络</h2><p>点击查询，显示 IP 质量、风险信号和各来源结果。</p></div></div></section>
    <div class="detail-sections">
      <details id="raw-data-details" class="detail-panel"><summary><span>原始数据 <small>逐库字段对照</small></span><span class="chevron" aria-hidden="true">⌄</span></summary><div class="detail-content"><div class="matrix-help"><span><i class="dot-hit"></i>命中</span><span><i class="dot-clear"></i>明确为否</span><span><i class="dot-unknown"></i>未提供</span><span class="scroll-hint">横向滑动查看全部字段 ↔</span></div><div id="database-matrix" class="matrix-wrap" role="region" aria-label="数据库原始字段，窄屏可横向滚动" tabindex="0"><p class="empty-detail">等待本轮查询结果。</p></div></div></details>
      <details id="weight-settings" class="detail-panel"><summary><span>评分设置 <small>来源权重与地区偏好</small></span><span class="chevron" aria-hidden="true">⌄</span></summary><div class="detail-content"><div class="country-setting"><label for="expected-country">期望国家</label><input id="expected-country" type="text" placeholder="可选，如 JP" maxlength="2" autocomplete="off" spellcheck="false" autocapitalize="characters"><span>留空按多库共识评估</span></div><div id="weight-controls"></div></div></details>
      <details class="detail-panel"><summary><span>检测方法 <small>评分依据与数据归属</small></span><span class="chevron" aria-hidden="true">⌄</span></summary><div class="detail-content"><div id="score-panel"><p class="empty-detail">查询后显示本轮评分维度与来源贡献。</p></div></div></details>
    </div>
    <footer><span>未知字段保持缺失，检测结果描述本轮观测。</span><a href="https://github.com/BlackSlience-Reaper/egress-observatory" target="_blank" rel="noopener noreferrer">Egress · GitHub ↗</a></footer>
  </main>
</body>
</html>
